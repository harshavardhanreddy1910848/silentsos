name: SilentSOS Production CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: SELENIUM WEB AUTOMATION TESTING (400 TEST CASES)
  # =========================================================================
  selenium-tests:
    name: 🌐 Selenium Web Tests (400 Cases)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/selenium/requirements.txt'

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/selenium/requirements.txt

      - name: 🧪 Execute Selenium Test Automation Suite
        run: |
          python tests/selenium/test_selenium.py

      - name: 📤 Upload Selenium Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: |
            reports/selenium/
            test-cases/selenium_test_cases.xlsx
          retention-days: 30

  # =========================================================================
  # JOB 2: APPIUM MOBILE AUTOMATION TESTING (390 TEST CASES)
  # =========================================================================
  appium-tests:
    name: 📱 Appium Mobile Tests (390 Cases)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/appium/requirements.txt'

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/appium/requirements.txt

      - name: 🧪 Execute Appium Test Automation Suite
        run: |
          python tests/appium/test_appium.py

      - name: 📤 Upload Appium Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report
          path: |
            reports/appium/
            test-cases/appium_test_cases.xlsx
          retention-days: 30

  # =========================================================================
  # JOB 3: LOAD TESTING (WEB ONLY - 370 TEST CASES)
  # =========================================================================
  load-tests:
    name: ⚡ Web Load & Stress Tests (370 Cases)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/load/requirements.txt'

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/load/requirements.txt

      - name: 🧪 Execute Web Load & Concurrency Benchmark Suite
        run: |
          python tests/load/run_load_test.py

      - name: 📤 Upload Load Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            reports/load-testing/
            test-cases/load_test_cases.xlsx
          retention-days: 30

  # =========================================================================
  # JOB 4: DAST SECURITY TESTING (WEB ONLY - 360 TEST CASES)
  # =========================================================================
  dast-security-tests:
    name: 🛡️ DAST Security Tests (360 Cases)
    runs-on: ubuntu-latest
    needs: [selenium-tests, appium-tests, load-tests]
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/dast/requirements.txt'

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/dast/requirements.txt

      - name: 🧪 Execute DAST Vulnerability & OWASP Top 10 Suite
        run: |
          python tests/dast/run_dast_security.py

      - name: 📤 Upload DAST Security Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dast-test-report
          path: |
            reports/dast-security/
            test-cases/dast_test_cases.xlsx
          retention-days: 30

  # =========================================================================
  # JOB 5: BUNDLE REPORTS (RUNS AFTER ALL 4 TEST SUITES PASS)
  # =========================================================================
  bundle-reports:
    name: 📦 Bundle Test Reports & Quality Gate
    runs-on: ubuntu-latest
    needs: [selenium-tests, appium-tests, load-tests, dast-security-tests]
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Aggregator Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: 📥 Download Selenium Artifacts
        uses: actions/download-artifact@v4
        with:
          name: selenium-test-report
          path: ./reports/selenium/

      - name: 📥 Download Appium Artifacts
        uses: actions/download-artifact@v4
        with:
          name: appium-test-report
          path: ./reports/appium/

      - name: 📥 Download Load Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: load-test-report
          path: ./reports/load-testing/

      - name: 📥 Download DAST Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dast-test-report
          path: ./reports/dast-security/

      - name: 📊 Consolidate Test Matrices & Generate Executive Summaries
        run: |
          python reports/bundle_reports.py

      - name: 📤 Upload Consolidated Quality Bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-test-reports
          path: |
            reports/
            test-cases/
          retention-days: 30

  # =========================================================================
  # JOB 6: DEPLOY WEB APPLICATION TO GITHUB PAGES
  # =========================================================================
  deploy:
    name: 🚀 Deploy Web App to GitHub Pages
    runs-on: ubuntu-latest
    needs: [bundle-reports]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: 🏗️ Build Production Web Application
        working-directory: frontend
        run: |
          npm run build

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Web Application Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
